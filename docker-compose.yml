version: "3.8"

services:
  # ------------------------------------------
  # PostgreSQL 数据库
  # ------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: agenthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenthub_password}
      POSTGRES_DB: ${POSTGRES_DB:-agenthub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenthub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------
  # Redis 缓存
  # ------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agenthub-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------
  # MinIO 对象存储
  # ------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: agenthub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ------------------------------------------
  # 后端服务 (FastAPI)
  # ------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agenthub-backend
    restart: unless-stopped
    environment:
      - ENV=production
      - DATABASE_URL=postgresql+asyncpg://agenthub:agenthub_password@postgres:5432/agenthub
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./sandbox:/app/sandbox
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  # ------------------------------------------
  # 前端服务 (Nginx 静态托管)
  # ------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: agenthub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:

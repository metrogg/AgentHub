services:
  server:
    build:
      context: .
    command: sh -lc "bun --filter @agenthub/db migrate && bun --filter @agenthub/server start"
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: /app/storage/agenthub.db
      CORS_ORIGIN: http://localhost:5173
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      ENABLE_LOCAL_CLI_PROBES: ${ENABLE_LOCAL_CLI_PROBES:-true}
      ENABLE_CODEX_CHATGPT_AUTH: ${ENABLE_CODEX_CHATGPT_AUTH:-true}
      ENABLE_DOCKER_MANAGEMENT: ${ENABLE_DOCKER_MANAGEMENT:-false}
      SYNC_CODEX_CLI_AUTH: ${SYNC_CODEX_CLI_AUTH:-true}
      CODEX_HOME: /codex
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-min-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    volumes:
      - agenthub-storage:/app/storage
      - agenthub-codex-home:/codex
      - .:/workspace:ro

  web:
    build:
      context: .
    command: bun --filter @agenthub/web dev --host 0.0.0.0
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8000/api
      VITE_PROXY_TARGET: http://server:8000
      VITE_WS_PROXY_TARGET: ws://server:8000
    ports:
      - "5173:5173"
    depends_on:
      - server

  cli-agent:
    build:
      context: .
    command: sleep infinity
    profiles:
      - agents
    working_dir: /workspace
    environment:
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CODEX_HOME: /codex
    volumes:
      - agenthub-codex-home:/codex
      - .:/workspace

volumes:
  agenthub-storage:
  agenthub-codex-home:

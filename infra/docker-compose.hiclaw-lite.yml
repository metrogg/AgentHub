services:
  tuwunel:
    image: "${AGENTHUB_TUWUNEL_IMAGE:-ghcr.io/matrix-construct/tuwunel:latest}"
    container_name: agenthub-tuwunel
    restart: unless-stopped
    ports:
      - "6167:6167"
    environment:
      CONDUWUIT_DATABASE_PATH: /data/conduwuit
      CONDUWUIT_ADDRESS: 0.0.0.0
      CONDUWUIT_PORT: "6167"
      CONDUWUIT_SERVER_NAME: agenthub.local
      CONDUWUIT_ALLOW_REGISTRATION: "true"
      CONDUWUIT_ALLOW_LEGACY_MEDIA: "true"
      CONDUWUIT_ALLOW_UNSTABLE_ROOM_VERSIONS: "true"
      CONDUWUIT_NEW_USER_DISPLAYNAME_SUFFIX: ""
      CONDUWUIT_CACHE_CAPACITY_MODIFIER: "2.0"
      CONDUWUIT_DELETE_ROOMS_AFTER_LEAVE: "true"
      CONDUWUIT_FORGET_FORCED_UPON_LEAVE: "true"
      CONDUWUIT_REGISTRATION_TOKEN: agenthub-dev-registration-token
    volumes:
      - agenthub-tuwunel-data:/data/conduwuit
    healthcheck:
      test: ["CMD", "tuwunel", "--version"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: "${AGENTHUB_MINIO_IMAGE:-quay.io/minio/minio:latest}"
    container_name: agenthub-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - agenthub-minio-data:/data
    healthcheck:
      test: ["CMD", "sh", "-lc", "wget -qO- http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  agenthub-tuwunel-data:
  agenthub-minio-data:
